name: Validate Supabase

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Supabase project.
        required: false
        type: string
        default: apps/supabase
      functions-directory:
        description: Directory containing Supabase edge functions.
        required: false
        type: string
        default: apps/supabase/functions
      supabase-cli-version:
        description: Supabase CLI version to install.
        required: false
        type: string
        default: 2.95.4
      deno-version:
        description: Deno version to install for edge function validation.
        required: false
        type: string
        default: 2.2.12
      validate-edge-functions:
        description: Run Deno formatting, linting, type checking, and tests for edge functions.
        required: false
        type: boolean
        default: true
      validate-database:
        description: Start a local Supabase database, apply migrations, and lint the schema.
        required: false
        type: boolean
        default: true
      deno-config-path:
        description: Optional Deno config path to pass to deno check/test.
        required: false
        type: string
        default: ''
      deno-lock-path:
        description: Optional Deno lockfile path to pass to deno check/test with --frozen=true.
        required: false
        type: string
        default: ''
      run-function-tests:
        description: Run Deno tests when edge function test files are present.
        required: false
        type: boolean
        default: true
      function-test-allow-env:
        description: Comma-separated environment variables available to Deno function tests.
        required: false
        type: string
        default: SUPABASE_URL,SUPABASE_ANON_KEY,SB_PUBLISHABLE_KEY
      db-lint-level:
        description: Error level emitted by supabase db lint.
        required: false
        type: string
        default: warning
      db-lint-fail-on:
        description: Minimum supabase db lint level that fails the job.
        required: false
        type: string
        default: warning

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge-functions:
    if: ${{ inputs.validate-edge-functions }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: test-key
      SB_PUBLISHABLE_KEY: test-key
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Verify function formatting
        run: deno fmt --check "${{ inputs.functions-directory }}"

      - name: Lint functions
        run: deno lint "${{ inputs.functions-directory }}"

      - name: Type check functions
        env:
          FUNCTIONS_DIRECTORY: ${{ inputs.functions-directory }}
          DENO_CONFIG_PATH: ${{ inputs.deno-config-path }}
          DENO_LOCK_PATH: ${{ inputs.deno-lock-path }}
        run: |
          mapfile -d '' files < <(find "$FUNCTIONS_DIRECTORY" -path '*/node_modules/*' -prune -o -name '*.ts' -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No TypeScript function files found."
            exit 0
          fi

          args=()
          if [ -n "$DENO_LOCK_PATH" ]; then
            args+=(--lock="$DENO_LOCK_PATH" --frozen=true)
          fi
          if [ -n "$DENO_CONFIG_PATH" ]; then
            args+=(--config "$DENO_CONFIG_PATH")
          fi

          deno check "${args[@]}" "${files[@]}"

      - name: Run function tests
        if: ${{ inputs.run-function-tests }}
        env:
          FUNCTIONS_DIRECTORY: ${{ inputs.functions-directory }}
          DENO_CONFIG_PATH: ${{ inputs.deno-config-path }}
          DENO_LOCK_PATH: ${{ inputs.deno-lock-path }}
          FUNCTION_TEST_ALLOW_ENV: ${{ inputs.function-test-allow-env }}
        run: |
          mapfile -d '' test_files < <(find "$FUNCTIONS_DIRECTORY" -path '*/node_modules/*' -prune -o \( -name '*_test.ts' -o -name '*.test.ts' \) -print0)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No Deno function test files found."
            exit 0
          fi

          args=()
          if [ -n "$DENO_LOCK_PATH" ]; then
            args+=(--lock="$DENO_LOCK_PATH" --frozen=true)
          fi
          if [ -n "$DENO_CONFIG_PATH" ]; then
            args+=(--config "$DENO_CONFIG_PATH")
          fi

          if [ -n "$FUNCTION_TEST_ALLOW_ENV" ]; then
            args+=(--allow-env="$FUNCTION_TEST_ALLOW_ENV")
          fi

          deno test "${args[@]}" "${test_files[@]}"

  database:
    if: ${{ inputs.validate-database }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ inputs.supabase-cli-version }}

      - name: Start local Supabase database
        run: supabase db start

      - name: Validate database migrations
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --local --level "${{ inputs.db-lint-level }}" --fail-on "${{ inputs.db-lint-fail-on }}"

      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup
