name: Validate Flutter Melos

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter SDK version to install.
        required: true
        type: string
      melos-version:
        description: Melos version to install.
        required: true
        type: string
      working-directory:
        description: Repository directory containing pubspec.yaml and melos.yaml.
        required: false
        type: string
        default: .

concurrency:
  group: validate-flutter-melos-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Flutter and Dart checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable

      - name: Install Melos
        env:
          MELOS_VERSION: ${{ inputs.melos-version }}
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Install dependencies
        run: melos bootstrap

      - name: Verify Flutter formatting
        run: melos run format:flutter:ci

      - name: Verify Dart formatting
        run: melos run format:dart:ci

      - name: Analyze Flutter project source
        run: melos run analyze:flutter:ci

      - name: Analyze Dart project source
        run: melos run analyze:dart:ci

      - name: Run Flutter tests
        run: melos run test:flutter:ci

      - name: Run Dart tests
        run: melos run test:dart:ci
